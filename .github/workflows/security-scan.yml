name: DAST Security Pipeline - Enhanced

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find project structure
        run: |
          echo "📂 Repository structure:"
          ls -la
          echo ""
          echo "🔍 Looking for pom.xml:"
          find . -name "pom.xml" -type f

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Build with Maven
        working-directory: ./dast-pipeline
        run: mvn clean package -DskipTests

      - name: Start OWASP ZAP
        run: |
          docker run -d --name zap \
            -u zap \
            -p 8080:8080 \
            -v $(pwd)/dast-pipeline:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true -config api.disablekey=true

      - name: Wait for ZAP to start
        run: |
          echo "⏳ Waiting for ZAP to start..."
          timeout 120 bash -c 'until curl -s http://localhost:8080 > /dev/null; do sleep 2; done'
          echo "✅ ZAP is ready!"

      - name: Run Security Tests (Auto-generates reports!)
        working-directory: ./dast-pipeline
        run: |
          echo "🧪 Running security tests..."
          mvn test -Dtest=SecurityTestSuite
          echo "✅ Tests completed! Reports auto-generated."
        continue-on-error: true

      - name: Generate ZAP HTML Report
        run: |
          docker exec zap zap-cli report -o /zap/wrk/reports/zap-report.html -f html || echo "⚠️ ZAP HTML report generation skipped"

      - name: Generate ZAP JSON Report
        run: |
          docker exec zap zap-cli report -o /zap/wrk/reports/zap-report.json -f json || echo "⚠️ ZAP JSON report generation skipped"

      - name: Generate ZAP XML Report
        run: |
          docker exec zap zap-cli report -o /zap/wrk/reports/zap-report.xml -f xml || echo "⚠️ ZAP XML report generation skipped"

      - name: Display Report Summary
        if: always()
        working-directory: ./dast-pipeline
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════════════════╗"
          echo "║         📊 Security Assessment Complete!                 ║"
          echo "╚═══════════════════════════════════════════════════════════╝"
          echo ""
          if [ -f "reports/security-report.json" ]; then
            echo "✅ Enhanced reports generated successfully!"
            echo ""
            echo "📁 Generated Reports:"
            ls -lh reports/ | grep -E '\.(html|json|md)$' || echo "No reports found"
          else
            echo "⚠️ Reports directory not found or empty"
          fi

      - name: Stop ZAP
        if: always()
        run: |
          docker stop zap || true
          docker rm zap || true

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            dast-pipeline/reports/
            dast-pipeline/target/custom-findings.json
            dast-pipeline/target/surefire-reports/

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dast-pipeline/reports
          destination_dir: reports/${{ github.run_number }}

      - name: Comment PR with Report Link
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const reportUrl = `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/${{ github.run_number }}/index.html`;
            
            const fs = require('fs');
            let customFindings = 0;
            try {
              if (fs.existsSync('dast-pipeline/target/custom-findings.json')) {
                const data = JSON.parse(fs.readFileSync('dast-pipeline/target/custom-findings.json', 'utf8'));
                customFindings = data.length;
              }
            } catch (e) {
              console.log('Could not read custom findings');
            }
            
            const body = `## 🔒 Security Scan Results
            
            **Run #${{ github.run_number }}** - [View Full Report](${reportUrl})
            
            ### 📊 Quick Summary
            - 🎯 Custom Test Findings: **${customFindings}**
            - 🕷️ OWASP ZAP Scan: Completed
            
            ### 📄 Available Reports
            - [📊 Full HTML Report](${reportUrl}/security-report.html)
            - [📄 JSON Report](${reportUrl}/security-report.json)
            - [📝 Markdown Report](${reportUrl}/security-report.md)
            - [🕷️ ZAP Report](${reportUrl}/zap-report.html)
            
            ---
            *Reports auto-generated by Enhanced DAST Pipeline*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });